# Build and publish a release to PyPI through trusted publishing (OIDC), so no
# API token is ever stored in the repository.
#
# The project's Publishing settings on PyPI name this repository as its trusted
# publisher, with workflow file "publish.yml" and environment "pypi". PyPI's
# provenance records show that this workflow uploaded every release from 0.1.0
# on. It runs when a GitHub release is published, and it uploads only what its
# own build job made from the tagged commit, never a dist/ built elsewhere.
name: Publish to PyPI

on:
  release:
    types: [published]

# Nothing in this workflow needs more than read access to the repository. The
# publish job raises id-token at job level, which is all that trusted publishing
# requires, so this default keeps the build job from inheriting a broader token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The tag, __version__, CITATION.cff, the README's citation and the
      # fallback in mkdocs.yml must name one version. CITATION.cff and the newest
      # dated changelog section must carry the UTC day the release is published,
      # and the README's citation its year. The check runs here alone because
      # CONTRIBUTING.md bumps __version__ well before tagging, so between
      # releases the files disagree by design. The event's values reach the
      # script through env, so a tag name is never spliced into the shell.
      - name: Check that the tag, version and dates agree
        env:
          TAG: ${{ github.event.release.tag_name }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: python tools/check_release.py --tag "$TAG" --published-at "$PUBLISHED_AT"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the distribution
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scopusflow/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true
