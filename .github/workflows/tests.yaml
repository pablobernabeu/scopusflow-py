name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  # Dependencies move when this repository does not. A weekly run turns an
  # upstream break into a dated red badge rather than a surprise on the next push.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # The Linux cells keep their old check names, such as 'pytest (3.12)'.
    name: pytest (${{ matrix.python-version }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Every Python release from the declared minimum to the newest on
        # Linux, and one release on Windows and on macOS. fetch.py and the app
        # handle Windows paths and permissions, which only a Windows runner
        # exercises.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - {os: windows-latest, python-version: "3.13"}
          - {os: macos-latest, python-version: "3.13"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # The app extra brings NiceGUI and jinja2, without which the app's tests
      # and the banner test skip. On 3.10 pip resolves NiceGUI 3, since
      # NiceGUI 4 needs 3.11 or later. pytest-cov is a CI concern rather than a
      # development requirement, so it is installed here rather than in the
      # dev extra, as the R twin installs covr in its coverage workflow rather
      # than in DESCRIPTION.
      - name: Install with the dev, plot and app extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plot,app]" pytest-cov

      # -rs lists each skip and its reason in the log.
      - name: Run the offline test suite
        run: python -m pytest -q -rs --cov=scopusflow --cov-report=term

      # The total goes into the run summary, as in the R twin's coverage
      # workflow. It is informational only, with no fail-under floor.
      - name: Add the coverage total to the run summary
        run: |
          echo "## Test coverage (Python ${{ matrix.python-version }}, ${{ runner.os }}): $(python -m coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"

      # The result is the same on every operating system, so the lint runs on
      # Linux only.
      - name: Lint
        if: runner.os == 'Linux'
        run: ruff check .

  # The matrix above installs the package editable from the checkout, where a
  # missing packaged file is masked by the source tree sitting next to it. This
  # job proves the built wheel stands on its own: install it into a bare
  # environment, leave the repository, and import it from there.
  wheel:
    name: Installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      # publish.yml runs twine check before it uploads. Running it here as
      # well, and every Monday, shows a build backend release whose metadata
      # twine rejects before the release day.
      - name: Build the distributions and check their metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel outside the checkout and import it
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          from importlib.metadata import entry_points

          import scopusflow

          # A version that resolves proves the distribution metadata installed,
          # not merely that the modules are importable from somewhere.
          print("scopusflow", scopusflow.__version__)
          assert scopusflow.__version__

          # The bundled CSV is reached through importlib.resources, so it is
          # found only if the wheel actually carries _data/. An import alone
          # never touches it, and a wheel built without it looks perfectly
          # healthy until a user calls this.
          assert len(scopusflow.example_records()) == 138

          # The console script's target must resolve in the installed
          # distribution; a typo in [project.scripts] surfaces nowhere else.
          scripts = entry_points(group="console_scripts")
          gui = [e for e in scripts if e.name == "scopusflow-gui"]
          assert gui, "scopusflow-gui is not installed as a console script"
          assert gui[0].load() is not None
          PY

  # The floors in pyproject are a promise to anyone resolving against an older
  # stack, and this job tests that promise. A failure here means the floors need
  # raising to what actually works, not that this job is too strict.
  minimum-versions:
    name: Declared minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.10'
      # matplotlib belongs here as much as the runtime floors: tests/test_plots.py
      # importskips at module scope, and the plotting tests in test_compare.py and
      # test_intersections.py importskip inline, so without it the whole plotting
      # layer would sit out the job that claims to test the floors. The nicegui
      # floor stays out: the offline app tests that need it, most of which build
      # the app's page in-process, skip without it, and installing its server
      # stack would test the resolver rather than this package.
      # numpy is capped even though this package never names it. pandas 1.5 and
      # matplotlib 3.5 both ship extensions compiled against numpy 1.x, and both
      # predate numpy 2, so neither can express the incompatibility in its own
      # metadata: pandas 1.5.3 asks for numpy>=1.21.0 with no ceiling. pip
      # therefore resolves the floors onto numpy 2 and the pair breaks at import
      # with "numpy.dtype size changed" and "_ARRAY_API not found". The floors
      # themselves are fine against the numpy of their era; it is the resolution
      # that was under-specified, so the cap belongs here rather than in a raised
      # floor.
      - name: Install the declared floors, then the package without resolution
        run: |
          python -m pip install --upgrade pip
          pip install "pybliometrics==4.4.*" "pandas==1.5.*" "matplotlib==3.5.*" "numpy<2" pytest
          pip install -e . --no-deps
      # -rs reports skips: a floor that quietly stops being exercised must show
      # in the log rather than hide behind a green tick.
      - name: Run the offline test suite
        run: pytest -q -rs
