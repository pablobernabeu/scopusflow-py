site_name: scopusflow (Python)
site_description: A reproducible workflow layer over pybliometrics for Scopus searches.
site_url: https://pablobernabeu.github.io/scopusflow-py/
repo_url: https://github.com/pablobernabeu/scopusflow-py
# repo_name is left unset so the header shows a compact "GitHub" chip.
# The licence link is absolute because the copyright line renders on every page,
# and a relative link would resolve against nested pages and break.
# The trademark note is worded exactly as the R twin's _pkgdown.yml footer words
# it, so that a reader moving between the two sites meets the same sentences.
copyright: >
  <span class="mrd-footer-badges">
  <a href="https://github.com/pablobernabeu/scopusflow-py/actions/workflows/tests.yaml"><img src="https://github.com/pablobernabeu/scopusflow-py/actions/workflows/tests.yaml/badge.svg" alt="tests"></a>
  <a href="https://lifecycle.r-lib.org/articles/stages.html#experimental"><img src="https://img.shields.io/badge/lifecycle-experimental-orange.svg" alt="Lifecycle: experimental"></a>
  <a href="https://opensource.org/license/MIT"><img src="https://img.shields.io/badge/license-MIT-blue.svg" alt="License: MIT"></a>
  </span>
  Developed by <a href="https://pablobernabeu.github.io">Pablo Bernabeu</a> ·
  Released under the
  <a href="https://pablobernabeu.github.io/scopusflow-py/licence/">MIT licence</a> ·
  'Scopus' is a trademark of Elsevier. scopusflow is an independent client, not
  affiliated with or endorsed by Elsevier.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  # The header and footer are held at the deep-navy brand ink in both schemes
  # (primary: black is the closest preset, retuned to the exact navy in
  # stylesheets/brand.css); accent carries the warm amber.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/brand.css

plugins:
  - search
  # Runs the offline example blocks at build time and embeds their output
  # (tables and figures), so the guides show results like a knitted R vignette.
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            separate_signature: true
            members_order: source
            # api.md groups its objects under six h2 sections, mirroring the
            # R package's reference index. At mkdocstrings' default level the
            # object headings would also be h2, flattening the table of contents
            # into one list in which no object shows which group it belongs to.
            heading_level: 3
  # Each path below was a page of the API reference, one per function group,
  # and those groups are the sections of api.md. The stub the plugin writes at
  # each path forwards a bookmark, a search result or a link from another site
  # to api.md, carrying any fragment across, and an object's anchor is the same
  # on api.md because mkdocstrings derives it from the object path rather than
  # from the page. The plugin writes every stub after the build, over any page
  # built at the same path, so a markdown file restored at one of these paths
  # would be built and then silently replaced by the stub.
  - redirects:
      redirect_maps:
        reference/plan-and-query.md: api.md
        reference/retrieve.md: api.md
        reference/records.md: api.md
        reference/dois.md: api.md
        reference/analyse.md: api.md

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      # Tag each block with its language, so brand.css can tell output pasted
      # into a `text` fence from a source block and style it as output.
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

nav:
  - Home: index.md
  - Get started: guides/getting-started.md
  # One page for the whole API, with the function groups as its sections, which
  # is how the other Python sites in the family present theirs. The sections keep
  # the names of the R twin's pkgdown reference sections, 'Plan and query' aside,
  # and api.md's own introduction says where the membership of a group differs.
  - API reference: api.md
  - Articles:
      - Designing queries: guides/designing-queries.md
      - Search plans and quota-aware retrieval: guides/plans-and-quota.md
      - Building a reference set: guides/building-a-reference-set.md
      - Analysing a literature: guides/analysing-a-literature.md
      - Author keywords and references: guides/keywords-and-references.md
      - Comparing topics: guides/comparing-topics.md
      - Tracking change over time: guides/tracking-literature-change.md
      - The code-free app: guides/the-app.md
  - Changelog: changelog.md
  - About: about.md

# The chip beside the title in the header names the newest release. docs.yml
# reads it from the newest v* tag when the site is built, rather than from a
# hand edit, which can name a version PyPI does not carry yet. When
# __version__ is ahead of that tag, docs.yml also exports it as
# SCOPUSFLOW_DEV_VERSION, and overrides/main.html then shows a banner saying these
# pages document a development version (set the variable by hand to preview it).
# A local build falls back on the version CITATION.cff cites, and
# tests/test_release_metadata.py keeps the two in step.
extra:
  version: !ENV [SCOPUSFLOW_RELEASED_VERSION, "0.3.0"]
  dev_version: !ENV [SCOPUSFLOW_DEV_VERSION, ""]
