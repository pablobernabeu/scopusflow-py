[build-system]
# Pinned below 1.32 because hatchling 1.32.0 raised the emitted core metadata to
# Metadata-Version 2.5, which the current twine cannot parse: "twine check" fails
# with "2.5 is not a valid metadata version", and that check gates the publish
# workflow. Raise the ceiling once twine accepts 2.5.
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[project]
name = "scopusflow"
dynamic = ["version"]
description = "A reproducible workflow layer over pybliometrics for Scopus searches"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Pablo Bernabeu", email = "pcbernabeu@gmail.com" }]
keywords = ["scopus", "bibliometrics", "pybliometrics", "literature", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # 4.4 is where pybliometrics.scopus gained the Reference namedtuple, which
    # abstract.py imports by name to shape the reference frame and to know its
    # columns when a document has none. The floor said 4.0, which never carried
    # it: anything from 4.0 to 4.3 resolved cleanly and then raised ImportError
    # on the first call that touched references. Nothing caught it because the
    # job that installs the floors was itself failing earlier, on an unrelated
    # numpy ABI break, so its output was never read past the first error.
    "pybliometrics>=4.4",
    "pandas>=1.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
# 2.14 is where NiceGUI gained ui.download.content, which app.py calls for
# every in-browser export: the reproducible script and the records, BibTeX,
# RIS and comparison downloads. The floor said 2.0, so anything from 2.0 to
# 2.13 resolved cleanly and then raised AttributeError on the first download
# click.
app = ["nicegui>=2.14", "matplotlib>=3.5"]
dev = ["pytest>=7", "ruff>=0.4"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "markdown-exec>=1.8", "matplotlib>=3.5", "mkdocs-redirects>=1.2"]

[project.scripts]
scopusflow-gui = "scopusflow.app:main"

[project.urls]
Homepage = "https://github.com/pablobernabeu/scopusflow-py"
Documentation = "https://pablobernabeu.github.io/scopusflow-py/"
"R twin" = "https://pablobernabeu.github.io/scopusflow/"

[tool.hatch.version]
path = "src/scopusflow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scopusflow"]

# overrides/partials/header.html is a fork of mkdocs-material's own partial.
# The docs extra declares no ceiling, so a deploy installs whatever is latest
# that day, and `mkdocs gh-deploy --strict` has nothing to say about a template
# that has silently fallen behind upstream. Recording the fork here rather than
# only in a comment lets the docs workflow compare the hash of the installed
# partial against the one the fork was taken from: a release that leaves the
# template alone passes, one that rewrites it fails the deploy. Kept out of
# overrides/ because MkDocs copies unrecognised files in the theme directory
# into the published site.
[tool.scopusflow.mkdocs-material-fork]
version = "9.7.6"
partials_header_sha256 = "8cf3fb15bcf969ff596649616fd99366b3c31c08d57a86d05308efc16d8fa75f"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

# State the rule set rather than inheriting whatever the installed ruff happens
# to default to. Ruff 0.16 widened its defaults, which turned a green CI red
# without a line of this package changing. The set below matches the theoryforge
# twin, so the family lints to one standard.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
